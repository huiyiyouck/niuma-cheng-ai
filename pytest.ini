[pytest]
# async 地基改造（AC-9 / 设计 §6.1）后，处理链路为协程，测试需 pytest-asyncio。
# auto 模式：async def 测试函数自动按 asyncio 跑，无需逐个加 @pytest.mark.asyncio。
asyncio_mode = auto
testpaths = tests
# 可导入性写进工具自身，不依赖调用者怎么起（实现 R2 Architect Review 中②）。
# **两条都要**：`tests` 包在仓根、`agent_hub` 在 `src/` 下——只写 `.` 时
# `import agent_hub` 仍要靠外部 PYTHONPATH 或已安装包。此前三个人各用各的方式
# 都能跑绿（Developer `PYTHONPATH=src`、DevOps `pip install -r` 后、Architect
# 同 Developer），**「能跑」本身不是被工具保证的**。
pythonpath = . src
